[project]
name = "forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eshangulati1234-a11y", email = "egul0001@student.monash.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "croniter>=6.2.4",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "laya>=0.4.15",
    "mcp>=2.3.0",
    "mss>=10.2.0",
    "openpyxl>=3.1.5",
    "playwright>=1.64.1",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pywinauto>=0.6.9",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "textual>=8.2.8",
    "tomlkit>=0.15.2",
    "torch>=2.14.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
forge = "forge.cli:app"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
